services:
  postgres:
    image: postgres:17-alpine
    container_name: salerent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: salerent
      POSTGRES_PASSWORD: salerent
      POSTGRES_DB: salerent
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
